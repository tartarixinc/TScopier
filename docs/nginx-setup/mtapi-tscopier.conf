# MTAPI Reverse Proxy — TScopier
# Listens on port 9443, proxies to MTAPI Docker container on localhost:8080
# Requires: Authorization: Bearer <API_KEY> header

# --- Upstream: MTAPI Docker container ---
upstream mtapi_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# --- Allowlisted IPs (Railway egress) ---
# Update these as Railway's IP ranges change.
# Find current ranges: https://docs.railway.com/reference/public-networking
geo $allowed_ip {
    default         0;
    162.243.0.0/16  1;   # Railway US East
    66.33.60.0/22   1;   # Railway US West
    209.38.0.0/16   1;   # Railway EU
}

server {
    listen 9443 ssl http2;
    server_name mtapi.tscopier.ai;

    # MTAPI sends broker credentials as query parameters — log without the query
    # string so passwords never reach disk. See mtapi_safe in nginx.conf.
    access_log /var/log/nginx/mtapi-access.log mtapi_safe;

    # --- SSL certificates (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/mtapi.tscopier.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtapi.tscopier.ai/privkey.pem;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Rate limiting ---
    limit_req zone=mtapi_limit burst=50 nodelay;
    limit_req_status 429;

    # --- Health endpoint (no auth required) ---
    location /health {
        proxy_pass http://mtapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- All other paths (auth required) ---
    location / {
        # Layer 1: IP whitelist — reject if not in allowlist
        if ($allowed_ip = 0) {
            return 403;
        }

        # Layer 2: API key auth — reject if bearer token is missing or wrong
        if ($auth_ok = 0) {
            return 401;
        }

        # --- Proxy to MTAPI ---
        proxy_pass http://mtapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for trade execution
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # --- Block common scanner paths ---
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        return 444;
    }

    location = /robots.txt {
        return 444;
    }

    # --- Custom error pages ---
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    error_page 429 = @rate_limited;

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"Valid API key required"}';
    }

    location @forbidden {
        default_type application/json;
        return 403 '{"error":"forbidden","message":"IP not allowed"}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Too many requests"}';
    }
}
