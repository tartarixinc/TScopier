user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- Basic ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Redacted format for the MTAPI proxy. The MTAPI protocol sends broker
    # credentials as URL query parameters (e.g. ConnectEx?password=...), so we
    # log $request_method + $uri only — never the query string.
    log_format mtapi_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --- Security ---
    server_tokens off;
    map_hash_bucket_size 128;

    # Rate limiting zone: 10 req/sec per IP, burst of 50
    limit_req_zone $binary_remote_addr zone=mtapi_limit:10m rate=10r/s;

    # --- API key auth via map ---
    # Compares "Authorization: Bearer <key>" header against expected key.
    # The expected key is injected by setup.sh via envsubst into the server block.
    # We map the incoming header to 1 (valid) or 0 (invalid).
    map $http_authorization $auth_ok {
        default                     0;
        "Bearer ${MTAPI_API_KEY}"   1;
    }

    # --- SSL (global defaults) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS (63072000 = 2 years) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Include server blocks ---
    include /etc/nginx/conf.d/*.conf;
}
