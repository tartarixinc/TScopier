# MTAPI tunnel server — WireGuard-only listener (option C).
#
# Copy to /etc/nginx/conf.d/mtapi-tscopier-tunnel.conf on the VPS after
# vps-setup.sh has brought wg0 up.
#
# Install only while wg0 is up (address 10.66.0.1 present). The production
# public listener is a wildcard `listen 9443` (no IP), so nginx still starts
# and serves public HTTPS when wg0 is down — verified on nginx 1.24. If the
# public listen were bound to a specific IP instead of a wildcard, a missing
# 10.66.0.1 would fail `nginx -t` / start for the whole process. Keep
# wg-quick@wg0 enabled; before a cold start with wg0 down, move this file out
# of /etc/nginx/conf.d/ if you are unsure the public listen is wildcard.
# Verify with: curl http://10.66.0.1:9443/health after wg-quick up.
#
# Plain HTTP inside the tunnel: WireGuard already encrypts the path.
# Checks X-Internal-Token (map $internal_ok) + Authorization Bearer (API key).
# Public HTTPS server (mtapi-tscopier.conf) stays on 0.0.0.0:9443 for the
# edge function. Connections to 10.66.0.1:9443 hit this block; connections to
# the public IP:9443 hit the SSL block.

server {
    listen 10.66.0.1:9443;
    server_name mtapi.tscopier.ai;

    # Redacted access log (no query string — passwords never hit disk)
    access_log /var/log/nginx/mtapi-access.log mtapi_safe;

    # --- Health (no auth — exact path only) ---
    location = /health {
        proxy_pass http://mtapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- All other paths (internal token + Bearer API key) ---
    location / {
        if ($internal_ok = 0) {
            return 403;
        }
        if ($auth_ok = 0) {
            return 401;
        }

        proxy_pass http://mtapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        return 444;
    }

    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    error_page 429 = @rate_limited;

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"Valid API key required"}';
    }

    location @forbidden {
        default_type application/json;
        return 403 '{"error":"forbidden","message":"Missing or invalid access token"}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Too many requests"}';
    }
}
