[build]
  command = "npm run build"
  publish = "dist"

# Public Turnstile site key (safe in client). Ensures prod/staging builds never
# ship with an empty key if the Netlify UI env var was forgotten — that caused
# "Signup protection is misconfigured" on app.tscopier.ai.
[build.environment]
  VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAENwYkTwFMwfAUdc"
  # The site key is public by design (it ships in the browser bundle), so Netlify's
  # secrets scanner must not fail the build on it. The Turnstile *secret* key is never in the repo.
  SECRETS_SCAN_OMIT_KEYS = "VITE_TURNSTILE_SITE_KEY"

# Hashed assets — long cache (immutable filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shell — always revalidate so deploys pick up new chunk hashes
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# SPA client-side routing (static files under /assets are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
